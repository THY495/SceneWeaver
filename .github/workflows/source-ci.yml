name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: sceneweaver
          POSTGRES_PASSWORD: sceneweaver_local
          POSTGRES_DB: sceneweaver_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sceneweaver -d sceneweaver_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sceneweaver:sceneweaver_local@127.0.0.1:55432/sceneweaver_test
      UV_NO_ENV_FILE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.1'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev
          npm --prefix apps/web ci
      - name: Verify isolated installation
        run: uv run --no-sync python scripts/check_environment.py
      - name: Verify source boundary and static checks
        run: uv run --no-sync python scripts/check.py --stage static
      - name: Check Studio and independent player web builds
        run: uv run --no-sync python scripts/check.py --stage frontend
      - name: Run offline backend regression
        run: uv run --no-sync python scripts/check.py --stage backend
      - name: Keep check logs, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-checks-python-${{ matrix.python }}
          path: |
            .runtime/checks/**/*.log
            .runtime/checks/**/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
